version: '3.8'

services:
  server:
    build: .
    ports:
      - "5005:5005"
    volumes:
      - ./www:/app/www
      - ./config.json:/app/config.json
      # TLS-only data plane: the keypair is generated locally
      # (./scripts/gen_dev_certs.sh) and never baked into the image.
      - ./certs:/app/certs:ro

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - server

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus