name: CI

# This workflow takes effect automatically when the repository is mirrored to GitHub;
# when using Gitee only, you can use Gitee Go to invoke the same ci.sh instead.

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ cmake \
            libspdlog-dev \
            nlohmann-json3-dev \
            zlib1g-dev \
            libssl-dev \
            libgtest-dev \
            python3 \
            cppcheck

      - name: Build
        run: ./ci.sh build

      - name: Unit tests
        run: ./ci.sh unit

      - name: Integration tests
        run: ./ci.sh integration

      - name: Install osv-scanner
        # Single static binary. The SBOM it scans is generated locally by
        # ./scripts/supply_chain.sh from build/server's linked libraries.
        #
        # Pinned on purpose (osv-scanner v1 CLI: `--sbom <file>`). Two reasons:
        #   1. `releases/latest` would silently move us to a future major whose
        #      CLI differs (v2 changed to subcommands), turning `--sbom` into an
        #      unknown-flag error — the gate would fail for the wrong reason, or
        #      a silent SKIP could pass as green.
        #   2. Pinning the tool version is itself a supply-chain control: the
        #      scanner that vets our dependencies must not float.
        run: |
          OSV_VERSION="v1.9.2"
          mkdir -p "$HOME/.local/bin"
          curl -sSLo "$HOME/.local/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Supply-chain gate (SAST + SBOM + SCA)
        run: ./ci.sh supply-chain

  package:
    # Builds the release tarball on the same glibc baseline as the release
    # workflow and runs it in clean containers of every supported
    # distribution. Only this catches a bundled-dependency gap: v0.2.0
    # shipped a tarball linking libfmt.so.8, which Ubuntu 24.04 (libfmt.so.9)
    # does not have, and both the ldd gate and the smoke test passed anyway
    # because they ran on the build host, which has everything.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ cmake \
            libspdlog-dev \
            nlohmann-json3-dev \
            zlib1g-dev \
            libssl-dev

      - name: Package release
        run: ./scripts/package_release.sh dist

      - name: Verify the artifact on target distributions
        run: ./scripts/verify_artifact.sh dist/*.tar.xz
