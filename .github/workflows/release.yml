name: Release

# Cut a release by pushing a version tag:
#   git tag v0.2.0 && git push origin v0.2.0 && git push gh v0.2.0
#
# Produces per-arch tarballs (x86_64 + aarch64) with sha256 checksums on
# the GitHub Release, plus a multi-arch Docker image on ghcr.io.
# This workflow only runs on GitHub; for Gitee, push the same tag and
# attach the artifacts manually (or drive ci.sh via Gitee Go).

on:
  push:
    tags: ['v*']

permissions:
  contents: write    # create the GitHub Release
  packages: write    # push to ghcr.io

jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: x86_64, runs-on: ubuntu-22.04 }   # older glibc = wider compatibility
          - { arch: aarch64, runs-on: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ cmake \
            libspdlog-dev \
            nlohmann-json3-dev \
            zlib1g-dev \
            libssl-dev \
            python3

      - name: Package release
        run: ./scripts/package_release.sh dist

      - name: Smoke test the packaged binary
        run: |
          STAGE=$(echo dist/epollthread-*/)
          cd "$STAGE"
          ./scripts/gen_dev_certs.sh
          nohup ./bin/epollthread > /tmp/smoke.log 2>&1 &
          PID=$!
          OK=1
          for i in $(seq 1 40); do
            if curl -sk --max-time 2 https://localhost:5005/healthz 2>/dev/null | grep -q ok; then OK=0; break; fi
            sleep 0.5
          done
          kill $PID 2>/dev/null || true
          if [ $OK -ne 0 ]; then
            # Dump the failure into the (public) job summary and as
            # annotations so it is readable without authentication.
            {
              echo "## Packaged binary smoke log"
              echo '```'
              cat /tmp/smoke.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -v '^$' /tmp/smoke.log | head -8 | while read -r l; do
              echo "::error title=smoke::$l"
            done || true
            exit 1
          fi
          echo "smoke OK: /healthz responded"

      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: |
            dist/*.tar.xz
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true, path: dist }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist/
          # NOTE: no pipe here — Actions' default shell lacks pipefail, so
          # `if ! gh ... | tee` would test tee's status and swallow errors.
          if ! gh release create "${{ github.ref_name }}" dist/*.tar.xz dist/*.sha256 \
              --title "${{ github.ref_name }}" \
              --generate-notes > /tmp/rel.log 2>&1; then
            {
              echo "## gh release create error"
              echo '```'
              cat /tmp/rel.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -v '^$' /tmp/rel.log | head -8 | while read -r l; do
              echo "::error title=gh::$l"
            done || true
            exit 1
          fi

  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
